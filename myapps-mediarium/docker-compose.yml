services:
  app_proxy:
    environment:
      APP_HOST: myapps-mediarium_server_1
      APP_PORT: 8264

  server:
    image: ghcr.io/rdborg/mediarium:latest
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Amsterdam
      DOWNLOADS_DIR: /data/downloads
      MOVIES_DIR: /media/movies
      TV_DIR: "/media/Tv Shows"
      MUSIC_DIR: /media/Music
    volumes:
      - ${APP_DATA_DIR}/config:/config
      - /home/umbrel/umbrel/external/Drive/Media/Downloads:/data
      - /home/umbrel/umbrel/external/Drive/Media/Movies:/media/movies
      - /home/umbrel/umbrel/external/Drive/Media/Tv Shows:/media/Tv Shows
      - /home/umbrel/umbrel/external/Drive/Media/Music:/media/Music

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      TZ: Europe/Amsterdam
