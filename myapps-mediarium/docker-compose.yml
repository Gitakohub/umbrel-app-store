services:
  app_proxy:
    environment:
      APP_HOST: myapps-mediarium_server_1
      APP_PORT: 8264

  server:
    image: ghcr.io/rdborg/mediarium:latest
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Amsterdam
      DOWNLOADS_DIR: /data
      MOVIES_DIR: /media/Movies
      TV_DIR: "/media/Tv Shows"
      MUSIC_DIR: /media/Music
    volumes:
      - ${APP_DATA_DIR}/config:/config
      - type: bind
        source: /home/umbrel/umbrel/external/Drive/Downloads/Mediarium
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /home/umbrel/umbrel/external/Drive/Media/Movies
        target: /media/Movies
        bind:
          create_host_path: false
      - type: bind
        source: /home/umbrel/umbrel/external/Drive/Media/Tv Shows
        target: /media/Tv Shows
        bind:
          create_host_path: false
      - type: bind
        source: /home/umbrel/umbrel/external/Drive/Media/Music
        target: /media/Music
        bind:
          create_host_path: false

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      TZ: Europe/Amsterdam
